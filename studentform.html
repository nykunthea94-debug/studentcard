<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Student Registration From</h1>
    <fieldset>
        <legend>Personal Information</legend>
        <div>
        <p>Full Name:<b>
            <input type="text" placeholder="Enter your full name"></b></p>
        </div>
        <div>
            <p>Email:<b><input type="email" placeholder="example@gmail.com"></b></p>
        </div>
        <div>
            <p>Passworld:<b><input type="password" ></b></p>
        </div>
        <div>
            <p>Date of Birth:<b><input type="date" placeholder=""></b></p>
        </div>
        <div>
            <label for="">Gender:</label>
            <input type="radio"> Male
            <input type="radio"> Female
        </div>
        <div>
            <p>Phone:<b><input type="text"></b></p>
        </div>
    </fieldset>
    <fieldset>
        <legend>academic Information</legend>
        <div>
            <p>Student ID:<b><input type="text"></b></p>
        </div>
        <div>
            <label for="">Major:</label>
            <select >
                <option>select Major</option>
                <option>CSS</option>
                <option>Javascript</option>
                <option>Python</option>
            </select>
        </div>
        <div>
            <label for=""> Skills:</label>
            <input type="checkbox"> HTML
            <input type="checkbox" > CSS 
            <input type="checkbox"> Javascript

        </div>
        <div>
            <label for="">Upload Photo:</label>
            <input type="file">
        </div>
    </fieldset>
    <fieldset>
        <legend>Additional Information</legend>
        <div>
            <label for="">Address:</label>
            <div>
            <textarea name="" id=""></textarea>
            </div>

        </div>
        <div>
            <label for=""> Personal Color:</label>
            <input type="color">
        </div>
    </fieldset>
    <label for=""></label>
    <input type="checkbox" > I agree to the registration terms.
    <div>
    <input type="submit" value="Register">
    <input type="submit" value="clear Form">

    </div>
</body>
</html>
